name: Brightside
description: 'Brightside (Brightside Benefit, Inc.) is an employer-sponsored financial
  care benefit that helps working families reduce everyday money stress. Delivered
  as an employee benefit through employers, Brightside pairs each employee with a
  human Financial Assistant and a mobile/web app offering emergency cash and loans,
  debt management and credit-score improvement, savings and early wage access, bill
  negotiation, crisis support (eviction, utilities, food), and guidance through major
  life events. The company is backed by a16z, Obvious Ventures, and Trinity Ventures.
  Brightside is a consumer-facing benefits platform and does not currently publish
  a public developer API or documentation.'
